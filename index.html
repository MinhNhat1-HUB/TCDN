            {

                    { id: 'D', text: "Tác động của đòn bẩy hoạt động càng giảm và tiến dần đến 1" }
                ],
                correctAnswer: 'D',
                explanation: "Công thức DOL = Q(P-V) / [Q(P-V) - F]. Khi Q rất lớn, F trở nên không đáng kể so với Q(P-V), do đó phân số tiến dần về 1."
            },
            {
                id: 43, chapterId: 5, tag: "Bài tập", source: "Đề Cương",
                text: "Dự án sản xuất 3.000 SP, giá bán thuần 200.000đ/SP. Biến phí tổng cộng (vật tư 360tr + tiền lương 60tr) là 420tr. Định phí 120 triệu đồng. Tính sản lượng hòa vốn (Q_be).",
                options: [
                    { id: 'A', text: "1.500 SP" },
                    { id: 'B', text: "2.000 SP" },
                    { id: 'C', text: "1.200 SP" },
                    { id: 'D', text: "3.000 SP" }
                ],
                correctAnswer: 'B',
                explanation: "Biến phí đơn vị (v) = 420.000.000 / 3000 = 140.000 đ/SP. Sản lượng hòa vốn Q_be = Định phí / (Giá bán - v) = 120.000.000 / (200.000 - 140.000) = 2.000 sản phẩm."
            },
            {
                id: 44, chapterId: 5, tag: "Bài tập", source: "Đề Cương",
                text: "Công ty có EBIT là 1 tỷ đồng/năm. Giá thị trường các khoản nợ 2 tỷ đồng, chi phí nợ trước thuế 12,5%/năm. WACC 16%/năm. Theo M&M (thuế 20%), xác định tỷ số nợ trên vốn chủ (D/E).",
                options: [
                    { id: 'A', text: "1/3" },
                    { id: 'B', text: "2/3" },
                    { id: 'C', text: "2/5" },
                    { id: 'D', text: "1/2" }
                ],
                correctAnswer: 'B',
                explanation: "Sử dụng công thức tính giá trị của công ty V = EBIT*(1-T)/WACC = 1*(1-0.2)/0.16 = 5 tỷ đồng. Vì Nợ D = 2 tỷ => Vốn chủ E = V - D = 5 - 2 = 3 tỷ. Tỷ số D/E = 2/3."
            }
        ];

        const theoryData = {
            1: `<h3>Tổng quan về Tài chính Doanh nghiệp</h3>
                <p><strong>Khái niệm:</strong> Tài chính doanh nghiệp là những quan hệ kinh tế dưới hình thức giá trị, phát sinh trong quá trình hình thành và sử dụng các quỹ tiền tệ của doanh nghiệp.</p>
                <p><strong>Mục tiêu:</strong> Tối đa hóa giá trị doanh nghiệp (tối đa hóa tài sản của cổ đông), thay vì chỉ tối đa hóa lợi nhuận hiện tại.</p>
                <p><strong>Các quyết định chủ yếu:</strong></p>
                <ul>
                    <li><strong>Quyết định đầu tư:</strong> Mua sắm tài sản cố định, ngân sách vốn (Capital Budgeting). Trả lời câu hỏi: Đầu tư vào tài sản nào.</li>
                    <li><strong>Quyết định tài trợ:</strong> Cấu trúc vốn (Capital Structure), kết hợp nợ và vốn cổ phần. Quyết định nguồn huy động vốn.</li>
                    <li><strong>Quyết định quản lý vốn luân chuyển:</strong> Quản lý tài sản ngắn hạn và nợ ngắn hạn.</li>
                </ul>`,
            2: `<h3>Giá trị theo thời gian của tiền tệ (Time Value of Money)</h3>
                <p><strong>Khái niệm:</strong> Một đồng tiền ngày hôm nay có giá trị hơn một đồng tiền trong tương lai do chi phí cơ hội, lạm phát và rủi ro.</p>
                <p><strong>Các phép tính cơ bản:</strong></p>
                <ul>
                    <li>Giá trị tương lai (FV) - Ghép lãi: Quá trình tính toán giá trị tương lai của một khoản tiền hiện tại. Lãi kép nghĩa là lãi nhập gốc.</li>
                    <li>Giá trị hiện tại (PV) - Chiết khấu: Quá trình tính toán giá trị hiện tại của một khoản tiền trong tương lai.</li>
                    <li><strong>Lãi suất hiệu dụng (EAR)</strong> là lãi suất thực tế nhận được khi ghép lãi nhiều lần trong năm.</li>
                </ul>`,
            3: `<h3>Lợi nhuận và Rủi ro</h3>
                <p><strong>Tỷ suất sinh lời (Return):</strong> Bao gồm lợi suất cổ tức (hoặc lãi vay) và lợi suất do tăng vốn (chênh lệch giá).</p>
                <p><strong>Rủi ro (Risk):</strong> Sự sai lệch của kết quả thực tế so với kết quả kỳ vọng. Đo lường bằng phương sai hoặc độ lệch chuẩn.</p>
                <p><strong>Danh mục đầu tư (Portfolio):</strong> Đa dạng hóa giúp loại trừ rủi ro phi hệ thống (rủi ro công ty), nhưng không loại trừ được rủi ro hệ thống (rủi ro thị trường).</p>
                <p><strong>Mô hình CAPM:</strong> E(Ri) = Rf + βi * [E(Rm) - Rf]. Giải thích mối quan hệ tuyến tính giữa rủi ro hệ thống (Beta) và tỷ suất sinh lợi kỳ vọng.</p>`,
            4: `<h3>Chi phí sử dụng vốn (Cost of Capital)</h3>
                <p><strong>Định nghĩa:</strong> Tỷ suất sinh lời tối thiểu mà doanh nghiệp phải đạt được từ các dự án đầu tư để duy trì giá trị doanh nghiệp.</p>
                <p><strong>WACC (Chi phí vốn bình quân gia quyền):</strong> Dùng trọng số là Giá trị thị trường.</p>
                <p>Chịu ảnh hưởng bởi các yếu tố không kiểm soát được (Lãi suất, thuế suất) và kiểm soát được (Cấu trúc vốn mục tiêu, chính sách cổ tức).</p>
                <ul>
                    <li>Chi phí nợ vay (rd): Được hưởng lợi ích tấm chắn thuế (Tax shield). Do đó chi phí nợ luôn ưu đãi hơn nếu có thuế.</li>
                    <li>Chi phí lợi nhuận giữ lại: Tính là chi phí cơ hội.</li>
                    <li>Tấm chắn thuế từ khấu hao và lãi vay rất quan trọng trong quyết định dòng tiền dự án.</li>
                </ul>`,
            5: `<h3>Lý thuyết cơ cấu vốn</h3>
                <p><strong>Lý thuyết M&M (Modigliani-Miller):</strong></p>
                <ul>
                    <li><em>Không thuế:</em> Cấu trúc vốn không ảnh hưởng đến giá trị doanh nghiệp (Vl = Vu).</li>
                    <li><em>Có thuế TNDN:</em> Giá trị DN có vay nợ lớn hơn nhờ hiện giá của tấm chắn thuế từ lãi vay.</li>
                </ul>
                <p><strong>Lý thuyết Trật tự phân hạng (Pecking Order):</strong> Doanh nghiệp ưu tiên sử dụng nguồn tài trợ theo thứ tự: (1) Lợi nhuận giữ lại, (2) Nợ vay, (3) Phát hành cổ phiếu mới.</p>
                <p><strong>Đòn bẩy hoạt động (DOL) & Đòn bẩy tài chính (DFL):</strong> DOL đo lường rủi ro kinh doanh, DFL đo lường rủi ro tài chính.</p>`
        };

        const formulasData = {
            2: `<h3>Công thức - Chương 2</h3>
                <ul>
                    <li><strong>Giá trị tương lai (FV):</strong> <code>FV = PV * (1 + r)^n</code></li>
                    <li><strong>Giá trị hiện tại (PV):</strong> <code>PV = FV / (1 + r)^n</code></li>
                    <li><strong>Lãi suất hiệu dụng (EAR):</strong> <code>EAR = (1 + r/m)^m - 1</code></li>
                    <li><strong>Hiệu ứng Fisher:</strong> <code>1 + R_danh_nghia = (1 + R_thuc) * (1 + Lạm_phát)</code></li>
                </ul>`,
            3: `<h3>Công thức - Chương 3</h3>
                <ul>
                    <li><strong>Tỷ suất sinh lợi kỳ vọng:</strong> <code>E(R) = Σ (Pi * Ri)</code></li>
                    <li><strong>Phương sai (σ²):</strong> <code>σ² = Σ [Pi * (Ri - E(R))²]</code></li>
                    <li><strong>Hệ số biến thiên (CV):</strong> <code>CV = σ / E(R)</code></li>
                    <li><strong>Định giá tài sản vốn (CAPM):</strong> <code>E(Ri) = Rf + β * (Rm - Rf)</code></li>
                </ul>`,
            4: `<h3>Công thức - Chương 4</h3>
                <ul>
                    <li><strong>Chi phí nợ sau thuế:</strong> <code>rd_after = rd * (1 - T)</code></li>
                    <li><strong>Chi phí vốn cổ phần (Gordon):</strong> <code>re = (D1 / P0) + g</code></li>
                    <li><strong>WACC:</strong> <code>WACC = Wd * rd * (1-T) + Wp * rp + We * re</code></li>
                </ul>`,
            5: `<h3>Công thức - Chương 5</h3>
                <ul>
                    <li><strong>Sản lượng hòa vốn:</strong> <code>Qbe = Định phí / (Giá bán - Biến phí)</code></li>
                    <li><strong>Đòn bẩy hoạt động (DOL):</strong> <code>DOL = (ΔEBIT / EBIT) / (ΔQ / Q) = Q(P - V) / [Q(P - V) - F]</code></li>
                    <li><strong>Đòn bẩy tài chính (DFL):</strong> <code>DFL = (ΔEPS / EPS) / (ΔEBIT / EBIT) = EBIT / (EBIT - I)</code></li>
                    <li><strong>Giá trị DN (M&M có thuế):</strong> <code>Vl = Vu + T*D</code></li>
                </ul>`
        };

        // --- COMPONENTS ---

        const Header = () => (
            <div className="bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-800 rounded-3xl p-8 md:p-12 text-white shadow-xl relative overflow-hidden mb-6">
                <div className="absolute top-0 right-0 -mt-10 -mr-10 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl"></div>
                <div className="relative z-10">
                    <div className="text-sm font-semibold uppercase tracking-wider mb-2 opacity-80">Bộ tài liệu ôn tập - Cập nhật 2026</div>
                    <h1 className="text-4xl md:text-5xl font-bold mb-4 leading-tight">Học chắc kiến thức.<br/>Nắm vững từng dạng bài.</h1>
                    <p className="text-purple-100 mb-6 max-w-2xl text-sm md:text-base">Hệ thống đã cập nhật tổng hợp hàng loạt câu hỏi từ các đề cương TCDN mới nhất.</p>
                </div>
            </div>
        );

        const MatrixAlert = () => (
            <div className="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 flex items-start gap-3 mb-6 shadow-sm">
                <div className="bg-white rounded-full p-1 shadow-sm mt-0.5">
                    <span className="text-emerald-500 text-lg">💡</span>
                </div>
                <p className="text-sm text-gray-700 leading-relaxed">
                    <span className="font-bold text-gray-900">Bản Cập Nhật Dữ Liệu:</span> Ngân hàng câu hỏi vừa được mở rộng cực lớn với các nguồn đề cương ôn tập bạn cung cấp. Tổng cộng có {questionsData.length} câu hỏi rải đều các chương. Bạn có thể làm thi thử để kiểm tra ngay!
                </p>
            </div>
        );

        // -- QUESTION CARD COMPONENT --
        const QuestionCard = ({ question, hideAnswers, userAnswer, onAnswerSelect, isSubmittedTest }) => {
            const [showExplanation, setShowExplanation] = useState(false);
            const isAnswered = userAnswer !== undefined;

            return (
                <div className="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm mb-4 transition-all">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <div className="flex gap-2 text-xs font-medium">
                            <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md">
                                CHƯƠNG {question.chapterId}
                            </span>
                            <span className="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-md">
                                {question.tag}
                            </span>
                        </div>
                    </div>
                    
                    <h3 className="text-lg font-semibold text-gray-800 mb-5 leading-relaxed">
                        {question.text}
                    </h3>

                    <div className="space-y-3">
                        {question.options.map((opt) => {
                            const isCorrect = opt.id === question.correctAnswer;
                            const isSelected = userAnswer === opt.id;
                            
                            let boxStyle = "border-gray-200 bg-white hover:bg-gray-50 text-gray-700 cursor-pointer";
                            let icon = null;

                            if (!hideAnswers || isSubmittedTest) {
                                if (isCorrect) {
                                    boxStyle = "border-green-500 bg-green-50 text-green-800 font-medium ring-1 ring-green-500";
                                    icon = <i className="fa-solid fa-check text-green-600"></i>;
                                } else if (isSelected && !isCorrect) {
                                    boxStyle = "border-red-400 bg-red-50 text-red-700 font-medium ring-1 ring-red-400 opacity-80";
                                    icon = <i className="fa-solid fa-xmark text-red-500"></i>;
                                } else {
                                    boxStyle = "border-gray-200 bg-white text-gray-400 opacity-60 cursor-default";
                                }
                            } else {
                                if (isAnswered) {
                                    if (isSelected) {
                                        boxStyle = "border-indigo-500 bg-indigo-50 text-indigo-800 font-medium ring-1 ring-indigo-500";
                                    } else {
                                        boxStyle = "cursor-default border-gray-200 opacity-60";
                                    }
                                } else {
                                     boxStyle = "border-gray-200 bg-white hover:border-indigo-300 hover:bg-indigo-50 cursor-pointer";
                                }
                            }

                            return (
                                <div 
                                    key={opt.id}
                                    onClick={() => {
                                        if (hideAnswers && !isSubmittedTest) {
                                            onAnswerSelect(question.id, opt.id);
                                        }
                                    }}
                                    className={`flex items-start gap-4 p-4 rounded-xl border transition-all duration-200 ${boxStyle}`}
                                >
                                    <div className={`flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-sm font-bold ${
                                        (isSelected || (!hideAnswers && isCorrect) || (isSubmittedTest && isCorrect)) 
                                        ? 'bg-white shadow-sm' : 'bg-gray-100 text-gray-500'
                                    }`}>
                                        {opt.id}
                                    </div>
                                    <div className="flex-1 pt-0.5 leading-tight">{opt.text}</div>
                                    {icon && <div className="flex-shrink-0 ml-2">{icon}</div>}
                                </div>
                            );
                        })}
                    </div>

                    {question.explanation && (!hideAnswers || isSubmittedTest || (hideAnswers && isAnswered)) && (
                        <div className="mt-5 pt-4 border-t border-gray-100">
                            <button 
                                onClick={() => setShowExplanation(!showExplanation)}
                                className="text-sm font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-2 transition-colors"
                            >
                                <i className={`fa-solid fa-chevron-${showExplanation ? 'up' : 'down'}`}></i>
                                {showExplanation ? "Ẩn giải thích" : "Xem giải thích chi tiết"}
                            </button>
                            
                            {showExplanation && (
                                <div className="mt-3 p-4 bg-indigo-50/50 rounded-xl text-sm text-gray-700 leading-relaxed border border-indigo-100">
                                    <span className="font-bold text-indigo-800 mr-2">Giải thích:</span> 
                                    {question.explanation}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // -- MOCK TEST COMPONENT --
        const MockTestModule = () => {
            const [testState, setTestState] = useState('setup'); 
            const [timeLeft, setTimeLeft] = useState(20 * 60); 
            const [testQuestions, setTestQuestions] = useState([]);
            const [userAnswers, setUserAnswers] = useState({});
            const [score, setScore] = useState(0);
            
            const timerRef = useRef(null);

            const startTest = () => {
                // Shuffle all questions and pick 20 random ones
                const shuffled = [...questionsData].sort(() => 0.5 - Math.random());
                setTestQuestions(shuffled.slice(0, 20));
                setTestState('playing');
                setTimeLeft(20 * 60); // 20 min timer
                setUserAnswers({});
                
                timerRef.current = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            clearInterval(timerRef.current);
                            submitTest(true);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
            };

            const submitTest = (auto = false) => {
                if(timerRef.current) clearInterval(timerRef.current);
                
                let correctCount = 0;
                testQuestions.forEach(q => {
                    if (userAnswers[q.id] === q.correctAnswer) correctCount++;
                });
                
                setScore(correctCount);
                setTestState('result');
                if(!auto) alert(`Bạn đã nộp bài thành công! Điểm: ${correctCount}/${testQuestions.length}`);
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            if (testState === 'setup') {
                return (
                    <div className="bg-white rounded-2xl p-10 text-center shadow-sm border border-gray-100">
                        <div className="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i className="fa-solid fa-stopwatch text-4xl text-indigo-600"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-4">Kiểm Tra Năng Lực Trắc Nghiệm TCDN</h2>
                        <p className="text-gray-600 mb-8 max-w-md mx-auto">Hệ thống sẽ chọn ngẫu nhiên 20 câu hỏi (trộn từ cả 5 chương trong ngân hàng đồ sộ). Thời gian làm bài là 20 phút. Phù hợp làm đề thi chuẩn bị cho thi cuối kỳ.</p>
                        <button 
                            onClick={startTest}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5"
                        >
                            Bắt đầu làm bài
                        </button>
                    </div>
                );
            }

            return (
                <div className="relative">
                    <div className="glass-header sticky top-0 z-50 p-4 rounded-b-2xl shadow-sm mb-6 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className={`p-2 rounded-lg font-bold text-lg ${timeLeft < 60 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-indigo-100 text-indigo-700'}`}>
                                <i className="fa-solid fa-clock mr-2"></i>
                                {formatTime(timeLeft)}
                            </div>
                            <span className="text-sm font-medium text-gray-500 hidden sm:block">
                                Đã làm: {Object.keys(userAnswers).length} / {testQuestions.length}
                            </span>
                        </div>
                        {testState === 'playing' ? (
                            <button onClick={() => submitTest(false)} className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-xl font-bold text-sm transition-colors">
                                Nộp Bài
                            </button>
                        ) : (
                            <button onClick={() => setTestState('setup')} className="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded-xl font-bold text-sm transition-colors">
                                Thi lại
                            </button>
                        )}
                    </div>

                    {testState === 'result' && (
                        <div className="bg-gradient-to-r from-green-50 to-emerald-50 rounded-2xl p-8 text-center mb-8 border border-green-100">
                            <h3 className="text-xl font-bold text-green-800 mb-2">Kết quả làm bài</h3>
                            <div className="text-5xl font-extrabold text-green-600 mb-4">
                                {(score / testQuestions.length * 10).toFixed(1)} <span className="text-2xl text-green-500 font-medium">điểm</span>
                            </div>
                            <p className="text-green-700 font-medium">Bạn trả lời đúng {score} trên tổng số {testQuestions.length} câu hỏi.</p>
                        </div>
                    )}

                    <div className="space-y-4">
                        {testQuestions.map((q, idx) => (
                            <div key={q.id} className="relative">
                                <div className="absolute top-6 -left-3 sm:-left-6 w-8 h-8 bg-gray-900 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-md z-10">
                                    {idx + 1}
                                </div>
                                <div className="ml-2 sm:ml-0">
                                    <QuestionCard 
                                        question={q} 
                                        hideAnswers={testState === 'playing'}
                                        isSubmittedTest={testState === 'result'}
                                        userAnswer={userAnswers[q.id]}
                                        onAnswerSelect={(qId, oId) => {
                                            if(testState === 'playing') setUserAnswers(prev => ({...prev, [qId]: oId}))
                                        }}
                                    />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // -- THEORY COMPONENT --
        const ContentTab = ({ type }) => {
            const [selectedChapter, setSelectedChapter] = useState(1);
            const dataSource = type === 'theory' ? theoryData : formulasData;

            return (
                <div className="flex flex-col lg:flex-row gap-8">
                    <div className="w-full lg:w-1/4 flex-shrink-0">
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 sticky top-4">
                            <h2 className="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <i className="fa-solid fa-layer-group text-indigo-500"></i> Chọn chương
                            </h2>
                            <div className="space-y-1">
                                {chaptersData.filter(c => c.id !== 0).map(chap => {
                                    const isActive = selectedChapter === chap.id;
                                    return (
                                        <button
                                            key={chap.id}
                                            onClick={() => setSelectedChapter(chap.id)}
                                            className={`w-full flex items-center justify-between p-3 rounded-xl text-left text-sm transition-all duration-200
                                                ${isActive 
                                                    ? 'bg-indigo-50 border-l-4 border-indigo-600 text-indigo-800 font-semibold' 
                                                    : 'border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                                                }`}
                                        >
                                            <span className={`truncate pr-2 ${isActive ? 'font-bold' : ''}`}>
                                                {chap.title}
                                            </span>
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                    
                    <div className="w-full lg:w-3/4">
                        <div className="bg-white rounded-2xl p-8 border border-gray-100 shadow-sm prose max-w-none text-gray-700">
                            {dataSource[selectedChapter] ? (
                                <div dangerouslySetInnerHTML={{ __html: dataSource[selectedChapter] }} />
                            ) : (
                                <p className="text-gray-400 italic text-center py-10">Đang cập nhật dữ liệu cho chương này...</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('questions'); 
            const [selectedChapter, setSelectedChapter] = useState(0); 
            const [searchQuery, setSearchQuery] = useState("");
            const [hideAnswers, setHideAnswers] = useState(false);
            const [userAnswers, setUserAnswers] = useState({});

            const filteredQuestions = useMemo(() => {
                return questionsData.filter(q => {
                    const matchChapter = selectedChapter === 0 || q.chapterId === selectedChapter;
                    const matchSearch = q.text.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                        q.options.some(opt => opt.text.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchChapter && matchSearch;
                });
            }, [selectedChapter, searchQuery]);

            const handleAnswerSelect = (questionId, optionId) => {
                setUserAnswers(prev => ({ ...prev, [questionId]: optionId }));
            };

            useEffect(() => {
                if (!hideAnswers) setUserAnswers({});
            }, [hideAnswers]);

            const getChapterCount = (chapId) => {
                if (chapId === 0) return questionsData.length;
                return questionsData.filter(q => q.chapterId === chapId).length;
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    <Header />
                    
                    {activeTab !== 'mocktest' && <MatrixAlert />}

                    <div className="flex flex-wrap items-center gap-2 mb-8 border-b border-gray-200 pb-px">
                        <button onClick={() => setActiveTab('questions')} className={`flex items-center gap-2 px-5 py-3 rounded-t-xl font-semibold text-sm transition-colors ${activeTab === 'questions' ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}>
                            <i className="fa-solid fa-file-lines"></i> {questionsData.length} câu hỏi ôn tập
                        </button>
                        <button onClick={() => setActiveTab('theory')} className={`flex items-center gap-2 px-5 py-3 rounded-t-xl font-semibold text-sm transition-colors ${activeTab === 'theory' ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}>
                            <i className="fa-solid fa-book-open"></i> Lý thuyết
                        </button>
                        <button onClick={() => setActiveTab('formulas')} className={`flex items-center gap-2 px-5 py-3 rounded-t-xl font-semibold text-sm transition-colors ${activeTab === 'formulas' ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`}>
                            <i className="fa-solid fa-calculator"></i> Công thức
                        </button>
                        <button onClick={() => setActiveTab('mocktest')} className={`flex items-center gap-2 px-5 py-3 rounded-t-xl font-semibold text-sm transition-colors ml-auto ${activeTab === 'mocktest' ? 'bg-green-500 text-white shadow-md' : 'text-green-600 hover:bg-green-50'}`}>
                            <i className="fa-solid fa-stopwatch"></i> Thi thử (Mới)
                        </button>
                    </div>

                    {activeTab === 'questions' && (
                        <div className="flex flex-col lg:flex-row gap-8">
                            <div className="w-full lg:w-1/4 flex-shrink-0">
                                <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 sticky top-4">
                                    <h2 className="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-layer-group text-indigo-500"></i> Chọn chương
                                    </h2>
                                    <div className="space-y-1">
                                        {chaptersData.map(chap => {
                                            const isActive = selectedChapter === chap.id;
                                            return (
                                                <button
                                                    key={chap.id}
                                                    onClick={() => setSelectedChapter(chap.id)}
                                                    className={`w-full flex items-center justify-between p-3 rounded-xl text-left text-sm transition-all duration-200
                                                        ${isActive ? 'bg-indigo-50 border-l-4 border-indigo-600 text-indigo-800 font-semibold' : 'border-l-4 border-transparent text-gray-600 hover:bg-gray-50'}`}
                                                >
                                                    <span className={`flex items-center gap-2 truncate pr-2 ${isActive ? 'font-bold' : ''}`}>
                                                        {chap.id === 0 && <span className="text-xl">🌈</span>}
                                                        {chap.title}
                                                    </span>
                                                    <span className={`text-xs font-medium px-2 py-1 rounded-md ${isActive ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-500'}`}>
                                                        {getChapterCount(chap.id)}
                                                    </span>
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="w-full lg:w-3/4">
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                                    <div className="relative w-full sm:w-1/2">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <i className="fa-solid fa-magnifying-glass text-gray-400"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder="Gõ vài chữ đầu của câu hỏi..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 outline-none text-sm shadow-sm"
                                        />
                                    </div>

                                    <div className="bg-white border border-gray-200 rounded-xl p-2 px-4 flex items-center gap-4 shadow-sm w-full sm:w-auto justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-indigo-100 text-indigo-600 p-2 rounded-lg">
                                                <i className="fa-solid fa-bullseye"></i>
                                            </div>
                                            <div>
                                                <div className="text-sm font-bold text-gray-800">Ẩn đáp án để tự luyện</div>
                                            </div>
                                        </div>
                                        
                                        <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                id="toggle" 
                                                checked={hideAnswers}
                                                onChange={() => setHideAnswers(!hideAnswers)}
                                                className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
                                            />
                                            <label htmlFor="toggle" className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <h2 className="text-xl font-bold text-gray-800">Ngân hàng trắc nghiệm ({filteredQuestions.length} câu)</h2>
                                </div>

                                <div className="space-y-4">
                                    {filteredQuestions.length > 0 ? (
                                        filteredQuestions.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                question={q} 
                                                hideAnswers={hideAnswers}
                                                userAnswer={userAnswers[q.id]}
                                                onAnswerSelect={handleAnswerSelect}
                                                isSubmittedTest={false}
                                            />
                                        ))
                                    ) : (
                                        <div className="text-center py-12 bg-white rounded-2xl border border-gray-200">
                                            <i className="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
                                            <p className="text-gray-500 font-medium">Không tìm thấy câu hỏi nào phù hợp.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'theory' && <ContentTab type="theory" />}
                    {activeTab === 'formulas' && <ContentTab type="formulas" />}
                    {activeTab === 'mocktest' && <MockTestModule />}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
